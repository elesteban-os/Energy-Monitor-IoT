services:
  mysql:
    image: mysql:8
    container_name: mysql-energy
    restart: unless-stopped
    ports:
      - "3307:3306"  # usa 3307 en host para evitar conflicto con un MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./API/.env

  api:
    build: ./API
    container_name: energy-api
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./API/.env

volumes:
  mysql_data:
